[package]
name = "call-analyzer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "call_analyzer_desktop_lib"
# Desktop-only: the mobile-oriented staticlib/cdylib types trip MinGW's
# export-table limit and are not needed here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
ca-core.workspace = true
ca-identity.workspace = true
ca-store.workspace = true
ca-ingest.workspace = true
ca-pipeline.workspace = true
ca-asr.workspace = true
ca-agents.workspace = true
ca-config.workspace = true
ca-metrics.workspace = true
ca-insights.workspace = true
ca-llm.workspace = true
ca-live.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
