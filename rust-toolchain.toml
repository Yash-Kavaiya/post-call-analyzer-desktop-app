[toolchain]
channel = "stable"
# Declared here so `cargo fmt` and `cargo clippy` work on a fresh clone
# without anyone having to discover `rustup component add` first. CI enforces
# both, so a contributor who lacks them finds out from a red build instead of
# from their own terminal — this closes that gap.
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-gnu"]
