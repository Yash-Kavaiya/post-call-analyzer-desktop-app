[workspace]
resolver = "2"
members = [
    "crates/ca-core",
    "crates/ca-audio",
    "crates/ca-llm",
    "crates/ca-asr",
    "crates/ca-diarize",
    "crates/ca-privacy",
    "crates/ca-agents",
    "crates/ca-rules",
    "crates/ca-identity",
    "crates/ca-sync",
    "crates/ca-live",
    "crates/ca-config",
    "crates/ca-metrics",
    "crates/ca-insights",
    "crates/ca-store",
    "crates/ca-ingest",
    "crates/ca-pipeline",
    "crates/ca-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
ca-core     = { path = "crates/ca-core" }
ca-audio    = { path = "crates/ca-audio" }
ca-llm      = { path = "crates/ca-llm" }
ca-asr      = { path = "crates/ca-asr" }
ca-diarize  = { path = "crates/ca-diarize" }
ca-privacy  = { path = "crates/ca-privacy" }
ca-agents   = { path = "crates/ca-agents" }
ca-rules    = { path = "crates/ca-rules" }
ca-identity = { path = "crates/ca-identity" }
ca-sync     = { path = "crates/ca-sync" }
ca-live     = { path = "crates/ca-live" }
ca-config   = { path = "crates/ca-config" }
ca-metrics  = { path = "crates/ca-metrics" }
ca-insights = { path = "crates/ca-insights" }
ca-store    = { path = "crates/ca-store" }
ca-ingest   = { path = "crates/ca-ingest" }
ca-pipeline = { path = "crates/ca-pipeline" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rayon       = "1"
regex       = "1"

# Disk is tight (21GB free) and debuginfo is the biggest consumer of target/.
# line-tables-only keeps backtraces useful at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
